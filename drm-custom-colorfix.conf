# /etc/default/drm-custom-colorfix.conf
# Configuration for DRM Custom Colorfix

# Target color temperature in Kelvin (1000-10000). Default is 8500.
TEMPERATURE=8500

# Brightness multiplier (0.1 - 1.0). Default is 1.0.
BRIGHTNESS=1.0

# Backend: 'auto' (detect GNOME vs COSMIC/DRM), 'gnome' (colord/ICC), or 'drm' (direct CRTC)
BACKEND=auto

# Optional connector filter (e.g. eDP-1, HDMI-A-1)
# CONNECTOR="eDP-1"

# Automatic VT micro-switch for DRM/COSMIC backend (1 = enabled, 0 = disabled)
# Automatically performs a 0.05s background bounce to bypass compositor lock on boot
AUTO_ACTIVATE=1

# DRM device to calibrate (leave commented out to auto-detect all connected GPUs)
# DEVICE="/dev/dri/card1"
